<!-- Playful Floating Characters Illustration (Matching the Reference Mobile Visual) -->
<div class="relative w-full h-64 sm:h-72 bg-gradient-to-b from-sky-50/60 via-purple-50/40 to-slate-100/30 flex items-center justify-center overflow-hidden select-none">
    <!-- Background Subtle Glows -->
    <div class="absolute -top-10 left-1/4 w-40 h-40 bg-pink-200/40 rounded-full blur-2xl"></div>
    <div class="absolute top-10 right-1/4 w-44 h-44 bg-blue-200/40 rounded-full blur-2xl"></div>
    
    <!-- SVG Vector Canvas with Interactive Characters & Connecting Doodle Lines -->
    <svg class="w-full h-full max-w-md mx-auto" viewBox="0 0 380 260" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Gradients for 3D Spheres -->
            <radialGradient id="gradGreen" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#86EFAC"/>
                <stop offset="60%" stop-color="#4ADE80"/>
                <stop offset="100%" stop-color="#16A34A"/>
            </radialGradient>
            
            <radialGradient id="gradPinkTop" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#F472B6"/>
                <stop offset="65%" stop-color="#EC4899"/>
                <stop offset="100%" stop-color="#DB2777"/>
            </radialGradient>
            
            <radialGradient id="gradCoral" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#FDA4AF"/>
                <stop offset="60%" stop-color="#FB7185"/>
                <stop offset="100%" stop-color="#E11D48"/>
            </radialGradient>

            <radialGradient id="gradBlue" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#93C5FD"/>
                <stop offset="60%" stop-color="#60A5FA"/>
                <stop offset="100%" stop-color="#2563EB"/>
            </radialGradient>

            <radialGradient id="gradYellow" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#FDE047"/>
                <stop offset="60%" stop-color="#FACC15"/>
                <stop offset="100%" stop-color="#CA8A04"/>
            </radialGradient>

            <radialGradient id="gradPeach" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#FDBA74"/>
                <stop offset="65%" stop-color="#FB923C"/>
                <stop offset="100%" stop-color="#EA580C"/>
            </radialGradient>

            <!-- Sphere Soft Drop Shadows -->
            <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.15"/>
            </filter>
        </defs>

        <!-- Playful Doodle Connecting Lines -->
        <path d="M 60 70 C 110 30, 180 80, 240 40 C 270 20, 310 45, 330 35" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <path d="M 50 140 C 10 180, 100 210, 80 160" stroke="#1E293B" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M 280 70 C 330 110, 350 150, 320 200" stroke="#1E293B" stroke-width="2" stroke-linecap="round" fill="none"/>

        <!-- 1. TOP-LEFT: Mint Green Sphere -->
        <g class="transition-transform duration-500 hover:scale-105" filter="url(#softShadow)">
            <circle cx="68" cy="78" r="42" fill="url(#gradGreen)"/>
            <!-- Cute Eyebrow & Eyes -->
            <path d="M 46 62 Q 58 48 76 60" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round" fill="none"/>
            <circle cx="70" cy="74" r="5" fill="#0F172A"/>
            <circle cx="68" cy="72" r="1.8" fill="#FFFFFF"/>
            <!-- Smile -->
            <path d="M 58 86 Q 70 96 82 86" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round" fill="none"/>
            <!-- Orbit Ring -->
            <ellipse cx="68" cy="92" rx="46" ry="12" stroke="#0F172A" stroke-width="2" fill="none" transform="rotate(-15 68 92)"/>
        </g>

        <!-- 2. TOP-CENTER: Pink Mini Sphere -->
        <g filter="url(#softShadow)">
            <circle cx="168" cy="48" r="26" fill="url(#gradPinkTop)"/>
            <!-- Cute simple face -->
            <line x1="160" y1="42" x2="160" y2="52" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
            <line x1="174" y1="42" x2="174" y2="52" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
        </g>

        <!-- 3. TOP-RIGHT: Coral/Pink Cheerful Sphere -->
        <g class="transition-transform duration-500 hover:scale-105" filter="url(#softShadow)">
            <circle cx="295" cy="70" r="44" fill="url(#gradCoral)"/>
            <!-- Whimsical Curly Hair on top -->
            <path d="M 285 28 C 290 18, 305 18, 310 24 C 315 28, 325 22, 322 34" stroke="#0F172A" stroke-width="4" stroke-linecap="round" fill="none"/>
            <!-- Eyes looking happy -->
            <circle cx="282" cy="62" r="6" fill="#0F172A"/>
            <circle cx="280" cy="60" r="2" fill="#FFFFFF"/>
            <circle cx="304" cy="64" r="6" fill="#0F172A"/>
            <circle cx="302" cy="62" r="2" fill="#FFFFFF"/>
            <!-- Happy Open Mouth -->
            <path d="M 288 78 Q 296 90 306 78 Z" fill="#0F172A"/>
        </g>

        <!-- 4. MID-LEFT: Soft Sky Blue Sphere -->
        <g class="transition-transform duration-500 hover:scale-105" filter="url(#softShadow)">
            <circle cx="72" cy="175" r="54" fill="url(#gradBlue)"/>
            <!-- Bold Thick Eyebrow -->
            <path d="M 44 145 Q 65 130 96 142" stroke="#0F172A" stroke-width="6" stroke-linecap="round" fill="none"/>
            <!-- Eyes -->
            <circle cx="74" cy="162" r="6" fill="#0F172A"/>
            <circle cx="72" cy="159" r="2" fill="#FFFFFF"/>
            <circle cx="98" cy="166" r="6" fill="#0F172A"/>
            <circle cx="96" cy="163" r="2" fill="#FFFFFF"/>
            <!-- Smirk Smile -->
            <path d="M 72 184 Q 88 194 94 180" stroke="#0F172A" stroke-width="4" stroke-linecap="round" fill="none"/>
        </g>

        <!-- 5. MID-RIGHT: Warm Golden Yellow Sphere -->
        <g class="transition-transform duration-500 hover:scale-105" filter="url(#softShadow)">
            <circle cx="290" cy="172" r="56" fill="url(#gradYellow)"/>
            <!-- Expressive Eyebrow -->
            <path d="M 264 148 Q 285 132 312 142" stroke="#0F172A" stroke-width="5" stroke-linecap="round" fill="none"/>
            <!-- Big Eyes Looking Left -->
            <circle cx="276" cy="158" r="7" fill="#0F172A"/>
            <circle cx="273" cy="155" r="2.5" fill="#FFFFFF"/>
            <circle cx="304" cy="162" r="7" fill="#0F172A"/>
            <circle cx="301" cy="159" r="2.5" fill="#FFFFFF"/>
            <!-- Content Smug Smile -->
            <path d="M 276 182 Q 296 195 314 182" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round" fill="none"/>
        </g>

        <!-- 6. BOTTOM-CENTER: Peach Mini Sphere with Glasses -->
        <g filter="url(#softShadow)">
            <circle cx="180" cy="205" r="24" fill="url(#gradPeach)"/>
            <!-- Eyebrows -->
            <path d="M 168 190 L 176 193" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>
            <!-- Glasses Frame -->
            <circle cx="172" cy="199" r="6" stroke="#0F172A" stroke-width="2.5" fill="none"/>
            <circle cx="186" cy="199" r="6" stroke="#0F172A" stroke-width="2.5" fill="none"/>
            <line x1="178" y1="199" x2="180" y2="199" stroke="#0F172A" stroke-width="2.5"/>
            <!-- Eyes inside glasses -->
            <circle cx="172" cy="199" r="2" fill="#0F172A"/>
            <circle cx="186" cy="199" r="2" fill="#0F172A"/>
            <!-- Surprised 'O' Mouth -->
            <ellipse cx="180" cy="214" rx="2.5" ry="3.5" fill="#0F172A"/>
            <!-- Tiny Legs -->
            <path d="M 172 230 C 170 234, 168 238, 166 242" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>
            <path d="M 188 230 C 190 234, 192 238, 194 242" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>
        </g>

        <!-- 7. CENTER: Dark Speech Bubble "Hello~" / "Azoria~" -->
        <g filter="url(#softShadow)" class="animate-bounce" style="animation-duration: 3s;">
            <!-- Little celebratory sparks above speech bubble -->
            <path d="M 148 108 L 144 102" stroke="#FB7185" stroke-width="3" stroke-linecap="round"/>
            <path d="M 154 106 L 156 100" stroke="#FB7185" stroke-width="3" stroke-linecap="round"/>

            <!-- Speech Bubble Body -->
            <rect x="150" y="112" width="90" height="42" rx="21" fill="#0F172A"/>
            <!-- Speech Pointer Tail -->
            <path d="M 176 154 L 166 164 L 184 154 Z" fill="#0F172A"/>
            <!-- Text Hello~ -->
            <text x="195" y="138" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">Hello~</text>
        </g>
    </svg>
</div>
