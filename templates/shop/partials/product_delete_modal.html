<div id="modal-container">
    <div x-data="{ show: true }" x-show="show" style="display: none;" class="fixed inset-0 z-[100] flex items-center justify-center overflow-y-auto overflow-x-hidden p-4 sm:p-6" x-cloak>
        <div x-show="show" x-transition.opacity class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm" @click="show = false; setTimeout(() => $el.closest('#modal-container').innerHTML = '', 300)"></div>
        
        <div x-show="show" x-transition:enter="ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95" x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100" x-transition:leave="ease-in duration-200" x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100" x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95" class="relative w-full max-w-sm transform overflow-hidden rounded-3xl bg-white dark:bg-slate-800 text-center align-middle shadow-2xl transition-all sm:my-8 border border-rose-100 dark:border-rose-900/50 p-6">
            
            <div class="w-16 h-16 bg-rose-50 dark:bg-rose-900/30 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="alert-triangle" class="h-8 w-8 text-rose-500"></i>
            </div>
            
            <h3 class="font-heading text-xl font-bold text-slate-900 dark:text-white mb-2">Êtes-vous sûr ?</h3>
            <p class="text-sm text-slate-500 mb-6">Voulez-vous vraiment supprimer le produit <strong class="text-slate-900 dark:text-white">"{{ product.name }}"</strong> ? Cette action est définitive.</p>
            
            <form hx-post="{% url 'shop:product_delete' product.uuid %}" hx-target="body" hx-push-url="true" class="flex gap-3 justify-center">
                {% csrf_token %}
                <button type="button" @click="show = false; setTimeout(() => $el.closest('#modal-container').innerHTML = '', 300)" class="px-5 py-2.5 text-sm font-bold text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 rounded-xl transition-colors shadow-sm">
                    Annuler
                </button>
                <button type="submit" class="px-5 py-2.5 text-sm font-bold text-white bg-rose-600 hover:bg-rose-700 rounded-xl transition-colors shadow-sm">
                    Oui, supprimer
                </button>
            </form>
        </div>
    </div>
    <script>
        lucide.createIcons();
    </script>
</div>
